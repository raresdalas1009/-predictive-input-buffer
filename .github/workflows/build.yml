name: Build Mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given  # the Geode version in mod.json
          cli: latest
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          for d in build*/ ; do
            cmake --build "$d" 2>&1 | grep -E "error" | head -25 | sed 's/^/::error::/' || true
          done
          combine: true
          target: ${{ matrix.config.target }}
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge (diagnostic)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          find artifacts -type f | sed 's/^/::notice::file /'
          gh release download -R geode-sdk/cli -p '*-linux.zip' -O cli.zip 2>&1 | sed 's/^/::notice::cli /'
          unzip -o -q cli.zip -d cli; chmod +x cli/geode
          ./cli/geode --version 2>&1 | sed 's/^/::notice::cli version /'
          FILES=$(find artifacts -name '*.geode' -type f | tr '\n' ' ')
          echo "::notice::merging $FILES"
          ./cli/geode package merge $FILES 2>&1 | tail -20 | sed 's/^/::error::merge /'
          for f in $FILES; do echo "::notice::$f: $(unzip -l "$f" | awk 'NR>3{print $4}' | grep -v '^$' | tr '\n' ' ')"; done
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: out
      - name: Create the release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version mod.json)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          FILE=$(find out -name '*.geode' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No .geode in the build output"
            exit 1
          fi
          cp "$FILE" basu.input-buffer.geode
          NOTES=$(tail -n 1 README.md)
          gh release create "$VERSION" basu.input-buffer.geode --title "Click Before Frames $VERSION" --notes "$NOTES"
